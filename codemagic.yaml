workflows:
  android-apk:
    name: Tabunganku APK (debug)
    max_build_duration: 30
       instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add Android platform
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Generate app icons (jika ada)
        script: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android
          else
            echo "Tidak ada assets/icon-only.png, pakai ikon bawaan."
          fi
      - name: Sync web assets
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
